name: Record Stream and Push

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 6  * * *"   # tiap hari jam 06:00 UTC (~14:00 WITA)

jobs:
  record:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        suffix: ["-s 0 -p 0"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup recording environment
        run: python main/setup.py record

      - name: Verify FFmpeg
        run: |
          ./ffmpeg -version
          ./ffprobe -version

      - name: Run recorder
        env:
          MY_ACCESS_KEY: ${{ secrets.MY_ACCESS_KEY }}
          MY_SECRET_KEY: ${{ secrets.MY_SECRET_KEY }}
        run: python main/record_v1.0.py ${{ matrix.suffix }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: output${{ matrix.suffix }}
          path: recordings/
          retention-days: 3
