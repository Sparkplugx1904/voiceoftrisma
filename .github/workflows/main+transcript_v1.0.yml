name: Record and Transcribe v1.0

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 5 * * *"   # Tiap hari jam 05:00 UTC (~13:00 WITA)

jobs:
  record:
    name: 🎙️ Record Stream and Upload
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suffix: ["-s 0 -p 0 --random-proxy stats --start-time 15:30"]
        # suffix: ["-s 0 -p 0 --random-proxy stats --no-upload --no-timer-limit"]
        # suffix: ["-s 0 -p 0"]
    outputs:
      url_s0p0: ${{ steps.map.outputs.url_s0p0 }}
      id_s0p0:  ${{ steps.map.outputs.id_s0p0 }}

    steps:
      - uses: actions/checkout@v4

      # - name: Setup Cloudflare WARP
      #   uses: fscarmen/warp-on-actions@v1.4
      #   with:
      #     stack: dual

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup recording environment
        run: python main/setup.py --record record_v1.0.py

      - name: Run recorder (auto-export ENV)
        id: record
        env:
          MY_ACCESS_KEY: ${{ secrets.MY_ACCESS_KEY }}
          MY_SECRET_KEY: ${{ secrets.MY_SECRET_KEY }}
          CDN_PROXY: ${{ secrets.CDN_PROXY }}
          GH_PROXY: ${{ secrets.GH_PROXY }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
          STREAM_URL: ${{ secrets.STREAM_URL }}

        run: |
          mkdir -p recordings
          python3 -u record_v1.0.py ${{ matrix.suffix }} 

      - name: Map environment vars to matrix outputs
        id: map
        run: |
          echo "[ INFO ] Global env values:"
          echo "  ARCHIVE_URL: $ARCHIVE_URL"
          echo "  ITEM_ID: $ITEM_ID"

          if [[ -z "$ARCHIVE_URL" || -z "$ITEM_ID" ]]; then
            echo "[ ERROR ] Environment variables missing!"
            exit 1
          fi

          echo "url_s0p0=$ARCHIVE_URL" >> $GITHUB_OUTPUT
          echo "id_s0p0=$ITEM_ID" >> $GITHUB_OUTPUT
          echo "[ OK ] Environment successfully mapped to job outputs."

      - name: Waiting...
        run: sleep 600

  transcribe:
    name: 🧠 Transcribe and Push to Archive
    needs: record
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pair:
          - { suffix: "s0p0", url: "${{ needs.record.outputs.url_s0p0 }}", item: "${{ needs.record.outputs.id_s0p0 }}" }

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup transcription environment
        run: python main/setup.py transcript

      - name: Transcribe audio
        run: |
          echo "[ INFO ] Transcribing audio_${{ matrix.pair.suffix }}.mp3..."
          python3 -u main/transcriptor_cpp.py "${{ matrix.pair.url }}" medium

      - name: Upload transcript artifact
        uses: actions/upload-artifact@v4
        with:
          name: vot-transcript-${{ matrix.pair.suffix }}
          path: transcripts/

      - name: Push transcript to Archive.org
        env:
          MY_ACCESS_KEY: ${{ secrets.MY_ACCESS_KEY }}
          MY_SECRET_KEY: ${{ secrets.MY_SECRET_KEY }}
          ITEM_ID: ${{ matrix.pair.item }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main/descriptor.py transcripts/transcript.srt -o transcripts/description.json
          python3 -u main/ia.py
