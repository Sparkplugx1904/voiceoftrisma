name: Record and Transcribe v3.0

# Rantai estafet: A memicu B lewat Cloudflare Worker (relay aman HMAC).
# Cloudflare Worker yang kemudian dispatch GitHub Actions Runner B.
# Runner B mengumumkan "siap merekam" ke Cloudflare, A menunggu sinyal ini
# sebelum cut dan upload. Transkriptor MATI bawaan (laptop tidak kuat).

on:
  workflow_dispatch:
    inputs:
      rantai_id:
        description: "ID rantai (biasanya tanggal YYYY-MM-DD)"
        required: true
        default: "manual"
      nomor:
        description: "Nomor lari dalam rantai (1, 2, 3...)"
        required: true
        default: "1"
      tumpang:
        description: "Durasi overlap A & B sama-sama rekam (detik, default 15 menit)"
        required: false
        default: "900"
      margin:
        description: "Buffer waktu B boot + mulai rekam sebelum A cut (detik)"
        required: false
        default: "300"
      max_umur:
        description: "Batas umur runner dari waktu boot (detik, default 5j30m)"
        required: false
        default: "19800"
      bagian:
        description: "Panjang tiap chunk rekaman (detik, uji live: isi 60)"
        required: false
        default: "600"
      induk_run_id:
        description: "ID lari induk (untuk unduh ekor warisan)"
        required: false
        default: ""
      perintah:
        description: "jalan / berhenti"
        required: false
        default: "jalan"
      mau_transkrip:
        description: "true = jalankan transkrip (berat, default mati)"
        required: false
        default: "false"
      stats_url:
        description: "URL stats icecast (kosongkan = pakai default)"
        required: false
        default: ""
      lewati_cek:
        description: "true = langsung rekam tanpa tunggu ON-AIR (uji live)"
        required: false
        default: "false"
      sesi:
        description: "Nomor sesi tayang siaran pada hari itu (1, 2, ...)"
        required: false
        default: "1"

run-name: "estafet ${{ inputs.rantai_id }} #${{ inputs.nomor }}"

permissions:
  actions: read
  contents: read

jobs:
  estafet:
    name: "🎙️ Estafet #${{ inputs.nomor }}"
    runs-on: ubuntu-latest
    timeout-minutes: 340 # 5 jam 40 mnt < batas 6 jam, kasih jeda
    steps:
      - name: Catat Waktu Boot VM
        run: echo "VM_BOOT_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Hentikan bila perintah=berhenti
        if: inputs.perintah == 'berhenti'
        run: |
          echo "[BERHENTI] perintah berhenti sejak awal, tidak merekam."
          exit 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup alat rekam
        run: python main/setup.py record

      # Catatan: ekor induk TIDAK diunduh di sini. B mengunduhnya sendiri
      # di tengah jalan via API (unduh_ekor_induk) karena ekor final A baru
      # ada setelah A benar-benar berhenti — B sendiri mulai lebih dulu
      # agar ada tumpang tindih isi.

      - name: Rekam estafet
        env:
          MY_ACCESS_KEY: ${{ secrets.MY_ACCESS_KEY }}
          MY_SECRET_KEY: ${{ secrets.MY_SECRET_KEY }}
          STREAM_URL: ${{ secrets.STREAM_URL }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          VM_BOOT_EPOCH: ${{ env.VM_BOOT_EPOCH }}
          # Kunci relay antar VM (harus sama dengan RELAY_SECRET di Cloudflare Worker)
          GH_RELAY_SECRET: ${{ secrets.GH_RELAY_SECRET }}
          CLOUDFLARE_RELAY_URL: https://voiceoftrisma.anandapradnyana68.workers.dev
        run: |
          mkdir -p recordings recordings/warisan
          CMD=(python3 -u main/record_v3.0.py
            --rantai-id "${{ inputs.rantai_id }}"
            --nomor "${{ inputs.nomor }}"
            --induk-run-id "${{ inputs.induk_run_id }}"
            --tumpang "${{ inputs.tumpang }}"
            --margin "${{ inputs.margin }}"
            --max-umur "${{ inputs.max_umur }}"
            --bagian "${{ inputs.bagian }}"
            --perintah "${{ inputs.perintah }}"
            --sesi "${{ inputs.sesi }}"
            --tanpa-batas-waktu
          )
          if [ -n "${{ inputs.stats_url }}" ]; then
            CMD+=(--stats-url "${{ inputs.stats_url }}")
          fi
          if [ "${{ inputs.lewati_cek }}" = "true" ]; then
            CMD+=(--lewati-cek)
          fi
          "${CMD[@]}"

      - name: Titip ekor untuk penerus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: estafet-ekor-${{ inputs.rantai_id }}-${{ github.run_id }}
          path: |
            recordings/ekor_*.mp3
            recordings/ekor_*.json
            recordings/manifest.json
          retention-days: 7
          if-no-files-found: warn

      - name: Titip hasil penuh
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: estafet-penuh-${{ inputs.rantai_id }}-${{ inputs.nomor }}
          path: recordings/
          retention-days: 7
          if-no-files-found: warn

  # Transkrip MATI bawaan. Nyalakan manual bila perlu (berat).
  transkrip:
    name: "📝 Transkrip (opsional)"
    needs: estafet
    if: inputs.mau_transkrip == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Transkrip diminta manual. Isi langkah whisper di sini bila perlu."
