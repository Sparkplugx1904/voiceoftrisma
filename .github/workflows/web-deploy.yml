name: 🚀 Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "15 23 * * *"   # Tiap hari jam 23:15 UTC (~07:15 WITA)
    - cron: "30 7 * * *"    # Tiap hari jam 07:30 UTC (~15:30 WITA)

jobs:
  deploy:
    name: 🚀 Deploy from main to web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout template
        uses: actions/checkout@v4
        with:
          repository: Sparkplugx1904/voiceoftrisma
          sparse-checkout: |
            template/main
            bin
          path: template

      - name: Setup and deploy
        env:
          WEB_TOKEN_SECRET: ${{ secrets.WEB_TOKEN }}
        run: |
          set -e

          echo "[ 1 / 5 ] Siapkan direktori web..."
          mkdir -p web
          ls -la template/

          echo "[ 2 / 5 ] Pindahkan template deploy..."
          rsync -av --delete template/template/main/ web/ || cp -r template/template/main/* web/

          echo "[ 3 / 5 ] Moved:"
          ls -la web/

          echo "[ 4 / 5 ] Clone web repo..."
          git clone "https://x-access-token:${WEB_TOKEN_SECRET}@github.com/voiceoftrisma/voiceoftrisma.github.io.git" web-repo
          # --exclude=.git/ PENTING: sumber (web/) bukan git repo, tanpa ini
          # rsync --delete ikut menghapus .git/ web-repo -> push jadi "not in a git directory"
          rsync -av --delete --exclude=.git/ web/ web-repo/

          echo "[ 5 / 5 ] Push to web repo..."
          cd web-repo
          git config user.name "VoT Deploy Bot"
          git config user.email "deploy@voiceoftrisma.radio"
          git add -A
          git diff-index --quiet HEAD || git commit -m "Auto-deploy $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
