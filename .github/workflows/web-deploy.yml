name: 🚀 Deploy to GitHub & Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "15 23 * * *"   # Tiap hari jam 23:15 UTC (~07:15 WITA)
    - cron: "30 7 * * *"    # Tiap hari jam 07:30 UTC (~15:30 WITA)

jobs:
  deploy:
    name: 🚀 Deploy from main to web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout template
        uses: actions/checkout@v4
        with:
          repository: Sparkplugx1904/voiceoftrisma
          sparse-checkout: |
            template/main
          path: template

      - name: Taking Resources
        run: |
          set -e
          echo "[ 1 / 2 ] Siapkan direktori web..."
          mkdir -p web
          ls -la template/

          echo "[ 2 / 2 ] Pindahkan template deploy..."
          rsync -av --delete template/template/main/ web/ || cp -r template/template/main/* web/

          echo "Resources siap di web/:"
          ls -la web/

      - name: Push to Github Pages
        env:
          WEB_TOKEN_SECRET: ${{ secrets.WEB_TOKEN }}
        run: |
          set -e

          echo "Push to primary repo (voiceoftrisma.github.io)..."
          git clone "https://x-access-token:${WEB_TOKEN_SECRET}@github.com/voiceoftrisma/voiceoftrisma.github.io.git" web-repo
          rsync -av --delete --exclude=.git/ web/ web-repo/
          cd web-repo
          git config user.name "VoT Deploy Bot"
          git config user.email "deploy@voiceoftrisma.radio"
          git add -A
          git diff-index --quiet HEAD || git commit -m "Auto-deploy $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
          cd ..

      - name: Push to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_TOKEN || secrets.CF_VOICEOFTRISMA || secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '662757545c219dc7fe8f563acfc079ca' }}
          command: pages deploy web --project-name=voiceoftrisma --commit-dirty=true