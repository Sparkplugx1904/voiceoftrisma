name: 🚀 Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "15 23 * * *"   # Tiap hari jam 23:15 UTC (~07:15 WITA)
    - cron: "30 7 * * *"    # Tiap hari jam 07:30 UTC (~15:30 WITA)

jobs:
  deploy:
    name: 🚀 Deploy from main to web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout template
        uses: actions/checkout@v4
        with:
          repository: Sparkplugx1904/voiceoftrisma
          sparse-checkout: |
            template/main
            bin
          path: template

      - name: Setup and deploy
        env:
          WEB_TOKEN_SECRET: ${{ secrets.WEB_TOKEN }}
          MP_WEB_TOKEN_SECRET: ${{ secrets.MP_WEB_TOKEN }}
        run: |
          set -e

          echo "[ 1 / 6 ] Siapkan direktori web..."
          mkdir -p web
          ls -la template/

          echo "[ 2 / 6 ] Pindahkan template deploy..."
          rsync -av --delete template/template/main/ web/ || cp -r template/template/main/* web/

          echo "[ 3 / 6 ] Moved:"
          ls -la web/

          echo "[ 4 / 6 ] Push to primary repo (voiceoftrisma.github.io)..."
          git clone "https://x-access-token:${WEB_TOKEN_SECRET}@github.com/voiceoftrisma/voiceoftrisma.github.io.git" web-repo
          rsync -av --delete --exclude=.git/ web/ web-repo/
          cd web-repo
          git config user.name "VoT Deploy Bot"
          git config user.email "deploy@voiceoftrisma.radio"
          git add -A
          git diff-index --quiet HEAD || git commit -m "Auto-deploy $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
          cd ..

          echo "[ 5 / 6 ] Push to secondary repo (madyapadma/voiceoftrisma)..."
          git clone "https://x-access-token:${MP_WEB_TOKEN_SECRET}@github.com/madyapadma/voiceoftrisma.git" mp-web-repo
          rsync -av --delete --exclude=.git/ web/ mp-web-repo/
          cd mp-web-repo
          git config user.name "VoT Deploy Bot"
          git config user.email "deploy@voiceoftrisma.radio"
          git add -A
          git diff-index --quiet HEAD || git commit -m "Auto-deploy $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

          echo "[ 6 / 6 ] Deploy selesai!"