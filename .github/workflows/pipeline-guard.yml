name: Pipeline Guard

on:
  schedule:
    - cron: "0 13 * * 6"   # Tiap hari Sabtu jam 13:00 UTC (~21:00 WITA)
  workflow_dispatch:
    inputs:
      limit:
        description: "Jumlah rekaman maksimal yang diproses"
        required: false
        default: "5"
      max_scan:
        description: "Jumlah rekaman terbaru yang diperiksa (default: 100)"
        required: false
        default: "100"
      item_id:
        description: "Archive.org Item ID tertentu (kosongkan jika scan otomatis)"
        required: false
        default: ""
      mode:
        description: "Strategi prioritas perbaikan arsip"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - describe_first
          - transcribe_only
          - describe_only
          - balanced
      whisper_model:
        description: "Model Whisper-CPP untuk transkripsi"
        required: false
        default: "medium"
        type: choice
        options:
          - medium
          - small
          - base
          - tiny
      gemini_model:
        description: "Model Gemini override (kosongkan untuk deteksi otomatis >= 2.5)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  scan:
    name: 🔍 Scan Archive Recordings
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.scan.outputs.matrix }}
      has_items: ${{ steps.scan.outputs.has_items }}
      count: ${{ steps.scan.outputs.count }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Scan Archive.org Items
        id: scan
        env:
          GITHUB_STEP_SUMMARY: ${{ env.GITHUB_STEP_SUMMARY }}
        run: |
          ITEM_ARG=""
          if [ -n "${{ inputs.item_id }}" ]; then
            ITEM_ARG="--item-id ${{ inputs.item_id }}"
          fi

          LIMIT="${{ inputs.limit || '5' }}"
          MODE="${{ inputs.mode || 'auto' }}"
          MAX_SCAN="${{ inputs.max_scan || '100' }}"

          python main/guard.py scan \
            --limit "$LIMIT" \
            --max-scan "$MAX_SCAN" \
            --mode "$MODE" \
            $ITEM_ARG \
            --export-github-output

  process:
    name: "🛡️ ${{ matrix.action == 'transcribe_and_describe' && '🎙️ Transcribe' || '📝 Describe' }}: ${{ matrix.item_id }}"
    needs: scan
    if: needs.scan.outputs.has_items == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.scan.outputs.matrix) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # ── Kasus A: Transkripsi & Deskripsi Lengkap ───────────────────────────
      - name: Setup Transcription Environment
        if: matrix.action == 'transcribe_and_describe'
        run: python main/setup.py transcript

      - name: Transcribe Audio
        if: matrix.action == 'transcribe_and_describe'
        run: |
          MODEL="${{ inputs.whisper_model || 'medium' }}"
          echo "[ INFO ] Transcribing ${{ matrix.item_id }} dari ${{ matrix.audio_url }} menggunakan model: $MODEL..."
          python3 -u main/transcribe.py "${{ matrix.audio_url }}" "$MODEL"

      - name: Generate Description from SRT
        if: matrix.action == 'transcribe_and_describe'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          SRT_FILE="transcripts/transcript.srt"
          if [ ! -f "$SRT_FILE" ] && [ -f "transcripts/transcript.txt" ]; then
            SRT_FILE="transcripts/transcript.txt"
          fi
          MODEL_ARG=""
          if [ -n "${{ inputs.gemini_model }}" ]; then
            MODEL_ARG="-m ${{ inputs.gemini_model }}"
          fi
          python main/descriptor.py "$SRT_FILE" -o transcripts/description.json $MODEL_ARG

      - name: Upload Transcript & Description to Archive.org
        if: matrix.action == 'transcribe_and_describe'
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          ITEM_ID: ${{ matrix.item_id }}
        run: |
          python3 -u main/archive.py

      # ── Kasus B: Patch Description Saja ───────────────────────────────────
      - name: Setup Description Environment
        if: matrix.action == 'describe_only'
        run: python main/setup.py guard

      - name: Generate & Upload Description Only
        if: matrix.action == 'describe_only'
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          SRT_ARG=""
          if [ -n "${{ matrix.srt_url }}" ]; then
            SRT_ARG="--srt-url ${{ matrix.srt_url }}"
          fi
          MODEL_ARG=""
          if [ -n "${{ inputs.gemini_model }}" ]; then
            MODEL_ARG="--model ${{ inputs.gemini_model }}"
          fi
          python3 -u main/guard.py fix-description \
            --item-id "${{ matrix.item_id }}" \
            $SRT_ARG \
            $MODEL_ARG

      # ── Log Summary ke GitHub Actions Step Summary ─────────────────────────
      - name: Log Step Summary
        if: always() && matrix.action != 'skip'
        run: |
          echo "### 🛡️ Pipeline Guard: ${{ matrix.item_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Aksi**: \`${{ matrix.action }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tautan Arsip**: [https://archive.org/details/${{ matrix.item_id }}](https://archive.org/details/${{ matrix.item_id }})" >> $GITHUB_STEP_SUMMARY

      # ── Artifact Backup ───────────────────────────────────────────────────
      - name: Upload Transcripts Artifact
        if: always() && matrix.action != 'skip'
        uses: actions/upload-artifact@v4
        with:
          name: guard-${{ matrix.item_id }}
          path: transcripts/
          if-no-files-found: ignore
          retention-days: 7
