<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice of Trisma - Dashboard Admin</title>
    <link rel="icon" href="../assets/madyapadma.svg" type="image/png">

    <!-- External Dependencies -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Dashboard Stylesheet -->
    <link rel="stylesheet" href="dashboard.css">
</head>

<body>

    <!-- ===== Top Bar ===== -->
    <header class="dash-topbar">
        <div class="dash-brand">
            <img src="../assets/madyapadma-voice-of-trisma-origin.svg" alt="Voice of Trisma" class="dash-logo">
            <div class="dash-brand-text">
                <h1>Dashboard Admin</h1>
                <p id="dashUser">Mengambil data...</p>
            </div>
        </div>
        <div class="dash-actions">
            <button class="icon-btn" id="themeToggleBtn" title="Ganti Tema" aria-label="Ganti Tema">
                <i class="fa-solid fa-moon"></i>
            </button>
            <a href="../" class="icon-btn" title="Lihat Situs" aria-label="Lihat Situs">
                <i class="fa-solid fa-tower-broadcast"></i>
            </a>
            <button class="btn-logout" id="logoutBtn" title="Keluar">
                <i class="fa-solid fa-right-from-bracket"></i> Keluar
            </button>
        </div>
    </header>

    <!-- ===== Layout: Nav + Konten ===== -->
    <div class="dash-layout">

        <!-- Navigasi section. CARA TAMBAH TAB BARU:
             duplikat baris <button> di bawah dengan data-section="nama-fitur",
             lalu buat <section id="section-nama-fitur"> dan daftarkan di
             SECTIONS pada dashboard.js -->
        <nav class="dash-nav" id="dashNav">
            <button class="dash-nav-item active" data-section="jadwal">
                <i class="fa-solid fa-calendar-days"></i> Jadwal Siaran
            </button>
            <!-- Contoh tab baru:
            <button class="dash-nav-item" data-section="pengumuman">
                <i class="fa-solid fa-bullhorn"></i> Pengumuman
            </button>
            -->
        </nav>

        <main class="dash-main">

            <!-- ===== Section: Jadwal Siaran ===== -->
            <section id="section-jadwal" class="dash-section">
                <div class="section-head">
                    <h2>Jadwal Siaran</h2>
                    <p>Edit jadwal harian di bawah. Perubahan baru tersimpan ke Cloudflare
                        setelah tombol <strong>Simpan Perubahan</strong> ditekan.</p>
                </div>
                <div id="jadwalContainer" class="day-grid">
                    <!-- Kartu hari dirender oleh dashboard.js -->
                </div>
            </section>

            <!-- Section baru diletakkan di sini, contoh:
            <section id="section-pengumuman" class="dash-section" style="display:none;">
                ...
            </section>
            -->

        </main>
    </div>

    <!-- ===== Save Bar (sticky bawah) ===== -->
    <div class="dash-savebar">
        <span id="saveStatus" class="save-status">Memuat jadwal...</span>
        <button id="saveBtn" class="btn-save" disabled>
            <i class="fa-solid fa-floppy-disk"></i> Simpan Perubahan
        </button>
    </div>

    <!-- Template baris jadwal (dipakai dashboard.js) -->
    <template id="rowTemplate">
        <tr class="jadwal-row">
            <td class="col-mulai"><input type="time" class="inp mulai" step="60" title="Waktu mulai"></td>
            <td class="col-selesai"><input type="time" class="inp selesai" step="60" title="Waktu selesai (kosongkan jika tidak ada)"></td>
            <td class="col-acara"><input type="text" class="inp acara" placeholder="Nama acara" maxlength="80"></td>
            <td class="col-penyiar"><input type="text" class="inp penyiar" placeholder="Penyiar" maxlength="40"></td>
            <td class="col-aksi">
                <button type="button" class="btn-del" title="Hapus baris" aria-label="Hapus baris">
                    <i class="fa-solid fa-trash"></i>
                </button>
            </td>
        </tr>
    </template>

    <script src="dashboard.js"></script>
</body>

</html>
